services:
  - type: web
    name: bjj-rollmaster
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: onboarding@resend.dev
      - key: PUBLIC_APP_URL
        sync: false
      - key: DB_PATH
        value: /data/rollmaster.db
    disk:
      name: rollmaster-data
      mountPath: /data
      sizeGB: 1
